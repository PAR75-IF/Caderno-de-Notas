{% extends 'app/base.html' %}

{% block titulo %}Criar conta - Caderno de Notas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h3 mb-4">Criar conta</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'app/_campos.html' %}
            <button type="submit" class="btn btn-primary">Criar conta</button>
            <a class="btn btn-link" href="{% url 'entrar' %}">Já tenho conta</a>
        </form>
        <p class="text-secondary small mt-4">
            {# Sem ideia de senha? Use o <a href="{% url 'passphrase' %}">gerador de passphrases</a>. #}
        </p>
    </div>
</div>
{% endblock %}
